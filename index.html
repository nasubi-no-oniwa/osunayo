 dive:[[.1,()=>SFX.whoosh()],[.6,()=>SFX.whoosh()],[1.4,()=>{SFX.splash(true);splash(0,-1.75,110,1.5);steamBoost=3;}],[2.05,()=>{SFX.splash(false);splash(0,-1.75,30,.8);SFX.hiss();}],[3.55,()=>{SFX.talk(7,1.15);}],[4.75,()=>{SFX.talk(6,.9);SFX.fanfare();SFX.applause();confetti(0,-.8);}]],
 bored:[[1.0,()=>{SFX.sigh();}],[1.25,()=>SFX.talk(6,.7)],[1.9,()=>SFX.bad()]]};
function hopEvents(a,b,x,z){const r=[];for(let u=a;u<b;u+=.45)r.push([u,()=>{SFX.hop();splash(x,z,8,.5);steamBoost=Math.min(3,steamBoost+.6);}]);return r;}
function evList(s){
 if(s.type==='intro')return EV.intro;if(s.type==='line')return EV.line;if(s.type==='pushy')return EV.pushy;if(s.type!=='out')return [];
 const k=s.kind;
 if(k==='early'||k==='clear'||k==='late')return [...EV.fall,...hopEvents(2.05,3.3,0,-.85),[3.45,k==='clear'?()=>{SFX.talk(6,1.1);SFX.fanfare();SFX.applause();confetti(0,-.8);}:()=>{SFX.angry();SFX.talk(7);}]];
 if(k==='both')return [...EV.both,...hopEvents(2.4,3.6,0,-1.2)];
 if(k==='dive')return [...EV.dive,...hopEvents(2.5,4.2,0,-1.75)];
 return EV.bored;}
function fireEv(s,t0,t1){for(const [at,f] of evList(s))if(at>t0&&at<=t1)f(s);}

function scene(s,t,T){
 const o={bm:null,bp:null,angry:false,big:null,dark:0,say:s.say||0};
 rest(MAN);rest(ME);ME.g.visible=false;hands.visible=false;hands.position.z=0;

 if(type==='line'||type==='wait'){

 if(type==='pushy'){

  else if(t>=1.35){MAN.head.rotation.z=.25;MAN.aR.rotation.x=.9;MAN.eR.rotation.x=.6;talkM(MAN,T,t<2);o.bm=tx('pushy2');}
  return o;}
 // 結末
 const k=s.kind;
 if(k==='early'||k==='clear'||k==='late'){
  const u=t-.12;
  if(t<.5){setCam(FP[0],FP[1]);hands.visible=true;hands.position.z=t<.12?-.42*(t/.12):-.42*(1-ph(t,.35,.5));}
  else if(t<3.3){const d=ph(t,.5,3.3);setCam(V3(3.7-d*.3,2.4,-.55-d*.2),WIDE[1],true);}
  else setCam(V3(2.7,1.95,-.85),V3(0,1.45,-.85),true);
  if(u<0){stand(MAN,0,MZ);idle(MAN,T);}
  else if(t<3.3){if(fall(MAN,u,0,-.55,TOE,-.85)){hotDance(MAN,u-1.6,0,-.85,-Math.PI/2);if(t<3.25)o.bm=tx('hot')[Math.floor((u-1.6)/.6)%3];}}
  else{const q=t-3.3;stand(MAN,0,-.85,.05);MAN.g.rotation.y=-Math.PI/2;
   if(k==='clear'){MAN.aR.rotation.x=2.6;MAN.aR.rotation.z=-.3;MAN.aL.rotation.z=.5;MAN.mouth.scale.set(.06,.03,.012);MAN.g.position.y+=Math.abs(Math.sin(q*7))*.05;if(q>.15){o.bm=tx('clear');o.big=tx('bigClear');}}
   else{angryB(MAN);MAN.aR.rotation.x=1.5;MAN.aL.rotation.z=.7;MAN.eL.rotation.z=-1.9;MAN.g.position.y+=Math.abs(Math.sin(q*14))*.05;talkM(MAN,T,q>.15&&q<1.2);if(q>.15){o.bm=tx(k);o.angry=true;}}}

 if(k==='both'){

   ME.g.rotation.y=-Math.PI/2-.4;ME.aR.rotation.z=-2.5;ME.eR.rotation.z=1.4;ME.head.rotation.z=.2;ME.mouth.scale.set(.05,.02,.012);
   if(q>.15){o.bm=tx('both');o.angry=true;}if(q>.85)o.big=tx('bigBoth');}
  return o;}
 if(k==='dive'){
  if(t<.6){const r=sm(t/.6);const q=(1-r)*(1-r),a=2*(1-r)*r,b=r*r;setCam(V3(0,q*2.85+a*4.0+b*3.6,q*2.3+a*1.2+b*-.3),V3(0,lerp(1.45,.85,r),lerp(-1.55,-1.8,r)));}
  else if(t<3.4){const d=ph(t,.6,3.4);setCam(V3(4.2-d*.4,2.7,-.5),V3(0,1.45,-.9),true);}

  stand(MAN,0,MZ);
  if(t<.25)idle(MAN,T);else if(t<3.4){MAN.neck.rotation.x=t<.9?.6:-.45;MAN.head.rotation.x=t<.9?.3:-.2;MAN.aL.rotation.z=.7;MAN.aR.rotation.z=-.7;MAN.eL.rotation.x=.8;MAN.eR.rotation.x=.8;MAN.mouth.scale.set(.05,.05,.012);}
  else{const q=t-3.4;MAN.g.rotation.y=-Math.PI/2*sm(q/.35);
   if(q<1.25){MAN.aL.rotation.z=2.5;MAN.aR.rotation.z=-2.5;MAN.g.position.y+=Math.abs(Math.sin(q*12))*.06;talkM(MAN,T,q>.15&&q<1);if(q>.12)o.bm=tx('dive');o.angry=true;}
   else{MAN.aL.rotation.x=1.3;MAN.aR.rotation.x=1.3;MAN.aL.rotation.z=-.35+Math.abs(Math.sin(q*14))*.3;MAN.aR.rotation.z=.35-Math.abs(Math.sin(q*14))*.3;MAN.mouth.scale.set(.06,.03,.012);talkM(MAN,T,q<2,true);o.bm=tx('dive2');o.big=tx('bigDive');}}
  if(t>=.6){ME.g.visible=true;
   if(t<1.4){const r=(t-.6)/.8;const P0=V3(0,2.95,.55),C=V3(0,4.3,-.6),P2=V3(0,.5,-1.75);const q=(1-r)*(1-r),a=2*(1-r)*r,b=r*r;ME.g.position.set(0,q*P0.y+a*C.y+b*P2.y,q*P0.z+a*C.z+b*P2.z);ME.g.rotation.x=-lerp(.9,2.75,r);ME.aL.rotation.x=2.95;ME.aR.rotation.x=2.95;ME.aL.rotation.z=.1;ME.aR.rotation.z=-.1;}

let mode='title',G=null,lastNow=performance.now(),Tsec=0;
const show=id=>{for(const p of ['title','result','vidPanel'])$(p).hidden=p!==id;};
function setSeg(s){G.seg=s;G.t=0;}
function startGame(){ac();clearFx();G={say:1,seg:null,t:0,log:[{type:'intro'}],down:null,kind:null,sent:false};setSeg({type:'intro',say:1});mode='play';show(null);
 $('hud').hidden=false;$('btnArea').hidden=false;$('skipBtn').hidden=false;resetBtns();updCnt(false);$('big').hidden=true;$('dark').style.opacity=0;}
function updCnt(pop){$('hudCnt').textContent=t('cnt',{n:G.say});if(pop){$('hudCnt').classList.remove('pop');void $('hudCnt').offsetWidth;$('hudCnt').classList.add('pop');}}
function waitSeg(){setSeg({type:'wait',n:G.say,say:G.say});$('skipBtn').hidden=true;jigT=0;}
function nextSeg(){const s=G.seg;
 if(s.type==='intro'||s.type==='line'){waitSeg();return;}
 if(s.type==='pushy'){G.say=4;updCnt(true);G.log.push({type:'line',n:4});setSeg({type:'line',n:4,say:4});return;}
 if(s.type==='out'){mode='end';setTimeout(showResult,250);}}
const canAct=()=>mode==='play'&&G&&G.seg&&G.seg.type==='wait';
function doNo(){if(!canAct())return;
 G.log.push({type:'wait',n:G.say,act:'no'});SFX.pop();
 const pb=$('pushBtn'),nb=$('noBtn');pb.classList.add('gone');nb.classList.add('morph');nb.textContent=t('push');setTimeout(resetBtns,300);
 if(G.say>=10){G.kind='bored';G.log.push({type:'out',kind:'bored'});setSeg({type:'out',kind:'bored',say:G.say});return;}
 if(G.say===3){G.log.push({type:'pushy'});setSeg({type:'pushy',say:3});return;}
 G.say++;updCnt(true);G.log.push({type:'line',n:G.say});setSeg({type:'line',n:G.say,say:G.say});}
function doPush(ms){if(!canAct())return;
 const n=G.say;let kind=n<=2?'early':n===3?(ms>=2000?'dive':ms>=1000?'both':'clear'):'late';
 G.kind=kind;G.hold=ms;G.log.push({type:'wait',n,act:'push',hold:ms});G.log.push({type:'out',kind});
 setSeg({type:'out',kind,say:n});$('btnArea').hidden=true;try{gtag('event','osunayo_end',{kind,say:n});}catch(e){}}

let off=0,jigT=0;
function maxOff(){return Math.max(140,Math.min(innerWidth/2-16,170));}
function placeBtn(){$('pushBtn').style.transform='translateX('+off+'px)';}
function resetBtns(){off=0;const pb=$('pushBtn'),nb=$('noBtn');pb.classList.remove('gone','down','jig');nb.classList.remove('morph');pb.textContent=t('push');nb.textContent=t('no');pb.style.transition='';placeBtn();}
const pb=$('pushBtn');
pb.addEventListener('pointerdown',e=>{if(G&&G.down)return;if(mode!=='play')return;e.preventDefault();ac();try{pb.setPointerCapture(e.pointerId);}catch(_){}
 G.down={id:e.pointerId,x:e.clientX,o:off,t:performance.now(),drag:false,timer:null};pb.classList.add('down');pb.style.transition='none';
 if(canAct()&&G.say===3)G.down.timer=setTimeout(()=>{const d=G&&G.down;if(d&&!d.drag){G.down=null;pb.classList.remove('down');doPush(2000);}},2000);});
pb.addEventListener('pointermove',e=>{const d=G&&G.down;if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x;
 if(!d.drag&&Math.abs(dx)>10){d.drag=true;pb.classList.remove('down');if(d.timer)clearTimeout(d.timer);}
 if(d.drag){const m=maxOff();const n=clamp(d.o+dx,-m,m);if(Math.abs(n-off)>18)SFX.slide();off=n;placeBtn();}});
function upPush(e,cancel){const d=G&&G.down;if(!d||e.pointerId!==d.id)return;G.down=null;if(d.timer)clearTimeout(d.timer);pb.classList.remove('down');pb.style.transition='transform .18s ease-out';
 if(d.drag||cancel){off=Math.abs(off)<46?0:Math.sign(off)*maxOff();placeBtn();return;}
 doPush(performance.now()-d.t);}
pb.addEventListener('pointerup',e=>upPush(e,false));pb.addEventListener('pointercancel',e=>upPush(e,true));
pb.addEventListener('contextmenu',e=>e.preventDefault());
$('noBtn').addEventListener('click',e=>{e.preventDefault();if(Math.abs(off)<46)return;doNo();});
$('skipBtn').onclick=()=>{if(mode==='play'&&G.seg.type==='intro'){waitSeg();}};

  if(mode==='play'&&s.type==='wait'){jigT+=dt;if(jigT>4.5){jigT=0;if(!G.down&&off===0){pb.classList.remove('jig');void pb.offsetWidth;pb.classList.add('jig');}}}
  $('btnArea').classList.toggle('off',!(s.type==='wait'));
  if(mode==='play'&&G.t>=segDur(s))nextSeg();}
 else if(mode==='result'){const o=scene(G.seg,segDur(G.seg),Tsec);applyO({...o,bm:null,bp:null,big:null,dark:0});}
 else{const o=scene(TITLE_SEG,0,Tsec);applyO({});}
 updFx(dt);R3.render(S3,cam);requestAnimationFrame(frame);}

 const r=await fetchR('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
 if(!r.ok)throw new Error('auth');const j=await r.json();a={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};ls.set('osn_auth',a);return a;}
if(!TEST)fbAuth().catch(()=>{});

 if(TEST){ls.set('osn_best',g);return best!==9;}

// ===== 動画（遊んだ回を作り直す） =====
let vidBlob=null,vidExt='mp4';
$('vidBtn').onclick=once(()=>makeVideo());
$('vBack').onclick=()=>show('result');
function vSegs(){const out=[];let say=1;
 for(const e of G.log){
  if(e.type==='intro')out.push({type:'intro',say:1,d:D.intro-1,off:1});
  else if(e.type==='line'){say=e.n;out.push({type:'line',n:e.n,say,d:D.line});}
  else if(e.type==='pushy')out.push({type:'pushy',say:3,d:D.pushy});
  else if(e.type==='wait'){const hold=e.act==='push'?Math.min(e.hold,2000)/1000:0;out.push({type:'wait',n:e.n,say:e.n,act:e.act,hold,d:e.act==='no'?1:Math.max(.55,.35+hold+.12)});}
  else if(e.type==='out')out.push({type:'out',kind:e.kind,say,d:D[e.kind]},{type:'card',kind:e.kind,say,d:2.2});}
 return out;}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function drawBub(g,txt,pos,W,H,cls,me){if(!txt||!pos)return;const p=pos.clone().project(cam);if(p.z>1)return;g.font='900 26px "Hiragino Maru Gothic ProN",system-ui,sans-serif';const w=Math.min(W-20,g.measureText(txt).width+28);
 const x=clamp((p.x*.5+.5)*W,w/2+10,W-w/2-10),y=clamp((-p.y*.5+.5)*H,190,H-170);
 g.fillStyle=cls?'#ffe0dc':me?'#dff0ff':'#fff';g.strokeStyle='#1d1d1d';g.lineWidth=4;rr(g,x-w/2,y-50,w,42,14);g.fill();g.stroke();g.beginPath();g.moveTo(x-8,y-9);g.lineTo(x,y+4);g.lineTo(x+8,y-9);g.fill();g.stroke();
 g.fillStyle=cls?'#b01c12':'#1d1d1d';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x,y-29,W-30);g.textBaseline='alphabetic';}
function drawPill(g,W,H,label,x,col,down){const w=150,h=86,y=H-150+(down?5:0);g.fillStyle='#1d1d1d';rr(g,x-w/2,H-150+6,w,h,22);g.fill();g.fillStyle=col;g.strokeStyle='#1d1d1d';g.lineWidth=5;rr(g,x-w/2,y,w,h,22);g.fill();g.stroke();
 g.fillStyle='#fff';g.font='900 30px "Hiragino Maru Gothic ProN",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(label,x,y+h/2,w-12);g.textBaseline='alphabetic';}
async function makeVideo(){
 if(!G||!G.kind)return;
 const VW=540,VH=960;const vc=document.createElement('canvas');vc.width=VW;vc.height=VH;
 if(!vc.captureStream||!window.MediaRecorder){show('vidPanel');$('vMsg').textContent=t('vfail');$('vShare').hidden=$('vSave').hidden=true;return;}
 show(null);const keep=mode;mode='video';$('recBadge').hidden=false;$('recBadge').textContent='● '+t('making');
 const g=vc.getContext('2d');const VR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});VR.setSize(VW,VH,false);VR.setPixelRatio(1);
 const oldA=cam.aspect;fitFov(VW/VH);
 ac();const dest=AC.createMediaStreamDestination();bus.connect(dest);
 const stream=vc.captureStream(30);dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc3,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}})||'';vidExt=mime.includes('mp4')?'mp4':'webm';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});}catch(e){done2(null);return;}
 const chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
 const segs=vSegs();clearFx();
 const stopped=new Promise(r=>{rec.onstop=r;});rec.start(200);
 let si=0,st=0,lastF=performance.now(),T=0;const gr=t('grades')[GRADE[G.kind]];
 await new Promise(resolve=>{
  function step(now){const dt=Math.min(.05,(now-lastF)/1000);lastF=now;T+=dt;
   let s=segs[si];const t0=st;st+=dt;
   const fe=(q,x,y)=>{if(q.type!=='card')fireEv(q,x+(q.off||0),y+(q.off||0));};
   if(st>=s.d&&si<segs.length-1){fe(s,t0,s.d);si++;st=st-s.d;s=segs[si];fe(s,-.001,st);}else fe(s,t0,Math.min(st,s.d));
   const scS=s.type==='card'?{type:'out',kind:s.kind,say:s.say}:s.type==='wait'?{...s,press:s.act==='push'&&st>s.d-s.hold-.12?1:0}:s;
   const o=scene(scS,s.type==='card'?D[s.kind]:Math.min(st,s.d)+(s.off||0),T);updFx(dt);
   VR.render(S3,cam);g.clearRect(0,0,VW,VH);g.drawImage(VR.domElement,0,0,VW,VH);
   if(o.dark){g.fillStyle='rgba(0,0,0,'+o.dark+')';g.fillRect(0,0,VW,VH);}
   const txt=(s2,x,y)=>{g.strokeText(s2,x,y);g.fillText(s2,x,y);};g.textAlign='center';g.lineJoin='round';
   if(s.type!=='card'){drawBub(g,o.bm,o.bm?headPos(MAN):null,VW,VH,o.angry,false);drawBub(g,o.bp,o.bp?headPos(ME):null,VW,VH,false,true);}
   g.lineWidth=8;g.strokeStyle='#000a';g.fillStyle='#fff';g.font='900 34px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('hud'),VW/2,60);
   g.font='900 26px "Hiragino Maru Gothic ProN",system-ui,sans-serif';g.fillStyle='#ffd23a';txt(t('cnt',{n:s.say||1}),VW/2,104);
   if(s.type==='wait'){const a=s.act,k=st;
    if(a==='no'){const sl=sm((k-.25)/.3);drawPill(g,VW,VH,t('no'),VW/2,'#2a6ad8',k>.7);if(k<.85)drawPill(g,VW,VH,t('push'),VW/2+sl*170,'#e8352a',false);}
    else drawPill(g,VW,VH,t('push'),VW/2,'#e8352a',k>s.d-s.hold-.12);}
   if(o.big&&s.type!=='card'){g.fillStyle='#ffd23a';g.lineWidth=10;g.strokeStyle='#a0400a';g.font='900 78px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(o.big,VW/2,VH*.66);}
   if(s.type==='card'){const a=sm(st/.4);g.fillStyle='rgba(0,0,0,'+(.55*a)+')';g.fillRect(0,0,VW,VH);g.globalAlpha=a;g.lineWidth=8;g.strokeStyle='#000';
    g.fillStyle='#fff';g.font='900 26px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('ttl'),VW/2,VH*.38);
    g.fillStyle=['#ffd23a','#7dff8a','#ff7a6a','#cccccc'][GRADE[G.kind]];g.font='900 '+(gr.length>8?40:54)+'px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt('「'+gr+'」',VW/2,VH*.38+66);
    g.fillStyle='#fff';g.font='900 24px "Hiragino Maru Gothic ProN",system-ui,sans-serif';wrapTxt(g,resLine(G.kind,G.n),VW/2,VH*.38+130,VW-60,34,txt);g.globalAlpha=1;}
   g.lineWidth=6;g.strokeStyle='#000a';g.fillStyle='#fffc';g.font='700 22px system-ui,sans-serif';txt(GAME_URL.replace('https://',''),VW/2,VH-30);
   if(si===segs.length-1&&st>=s.d)resolve();else requestAnimationFrame(step);}
  requestAnimationFrame(step);});
 rec.stop();await stopped;try{bus.disconnect(dest);}catch(_){}
 VR.dispose();fitFov(oldA);clearFx();mode=keep;
 done2(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function done2(blob){$('recBadge').hidden=true;mode='result';show('vidPanel');vidBlob=blob;
  if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=true;$('vSave').hidden=true;return;}
  const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
  const file=new File([blob],'osunayo.'+vidExt,{type:blob.type});const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  $('vShare').hidden=!canShare;$('vSave').hidden=false;$('vMsg').textContent=canShare?t('vmade'):t('shareHint');
  $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:postText()+'\n'+GAME_URL});}catch(e){}};
  $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='osunayo_'+G.kind+'_'+G.n+'.'+vidExt;document.body.appendChild(a);a.click();a.remove();};}}
function wrapTxt(g,s,x,y,maxW,lh,txt){let line='',yy=y;for(const ch of s){if(g.measureText(line+ch).width>maxW&&line){txt(line,x,yy);line='';yy+=lh;}line+=ch;}if(line)txt(line,x,yy);}
