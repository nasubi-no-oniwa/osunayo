// 吹き出し：まず頭の上の位置を決め、あとで上の帯・ワイプ・大きい文字・テロップ・ボタン・ほかの吹き出しと重ならない所へずらす
function bubAt(el,txt,pos,cls){if(!txt||!pos){el.hidden=true;el.dataset.t='';el._prev=null;return;}const p=pos.clone().project(cam);if(p.z>1){el.hidden=true;el._prev=null;return;}
 const W=innerWidth,H=innerHeight;el._x=(p.x*.5+.5)*W;el._y=(-p.y*.5+.5)*H;el.hidden=false;
 if(el.dataset.t!==txt){el.textContent=txt;el.dataset.t=txt;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
 el.classList.toggle('angry',!!cls);}
function ovl(a,b){return Math.max(0,Math.min(a.r,b.r)-Math.max(a.l,b.l))*Math.max(0,Math.min(a.b,b.b)-Math.max(a.t,b.t));}
// w,h：吹き出しの大きさ。x0,y0：しっぽの先。いちばん重ならない置き場所をえらぶ（前と同じ置き場所を少しひいきして、ちらつかないようにする）
function placeBub(w,h,x0,y0,obs,W,H,prev){
 const cx=x=>clamp(x,w/2+8,W-w/2-8),cy=y=>clamp(y,h+70,H-150);
 const cand=[[0,0]];if(prev&&(prev[0]||prev[1]))cand.push(prev);
 for(let k=1;k<=4;k++){cand.push([0,-k*(h+10)]);cand.push([0,k*(h+10)]);}
 for(const dx of [-1,1])for(let k=0;k<=2;k++)cand.push([dx*(w*.6+24),-k*(h+10)]);
 let best=null,bs=1e18;
 for(const c of cand){const x=cx(x0+c[0]),y=cy(y0+c[1]);const R={l:x-w/2,t:y-h,r:x+w/2,b:y+12};let sc=0;for(const o of obs)sc+=ovl(R,o)*100;
  sc+=Math.hypot(x-x0,y-y0)+(prev&&c===prev?-30:0);if(sc<bs){bs=sc;best={x,y,c,R};}}
 return best;}
function rectOf(el,pad){const r=el.getBoundingClientRect();return {l:r.left-pad,t:r.top-pad,r:r.right+pad,b:r.bottom+pad};}

 for(const id of ['bubM','bubP','bubG']){const el=$(id);if(el.hidden||el._x==null)continue;const b=placeBub(el.offsetWidth,el.offsetHeight,el._x,el._y,obs,W,H,el._prev);el._prev=b.c;el.style.left=b.x+'px';el.style.top=b.y+'px';obs.push({l:b.R.l-6,t:b.R.t-6,r:b.R.r+6,b:b.R.b});}}

function vSegs(){const out=[];let say=1;

  if(e.type==='intro'){if(e.at!=null){const off=Math.max(0,e.at-1.6);out.push({type:'intro',say:1,d:Math.max(.3,e.at-off),off});}else out.push({type:'intro',say:1,d:D.intro-1,off:1});}
  else if(e.type==='line'){say=e.n;out.push({type:'line',n:e.n,say,d:D.line});}
  else if(e.type==='pushy')out.push({type:'pushy',say:3,d:D.pushy});
  else if(e.type==='wait'){
   if(e.act==='gaya')out.push({type:'wait',n:e.n,say:e.n,act:'gaya',hold:0,d:1.5});
   else if(e.act==='push'&&e.fui)out.push({type:'wait',n:e.n,say:e.n,act:'push',hold:.1,d:1.3,fuiAt:.9,side:e.side});
   else{const hold=e.act==='push'?Math.min(e.hold,2400)/1000:0;out.push({type:'wait',n:e.n,say:e.n,act:e.act,hold,d:e.act==='no'?1:Math.max(.55,.35+hold+.12)});}}
  else if(e.type==='out')out.push({type:'out',kind:e.kind,say,side:e.side,d:D[e.kind]},{type:'card',kind:e.kind,say,d:2.2});}
 return out;}

 g.fillStyle=cls?'#ffe0dc':me?'#dff0ff':'#fff';g.strokeStyle='#1d1d1d';g.lineWidth=4;rr(g,x-w/2,y-50,w,42,14);g.fill();g.stroke();g.beginPath();g.moveTo(x-8,y-9);g.lineTo(x,y+4);g.lineTo(x+8,y-9);g.fill();g.stroke();

   VR.render(S3,cam);const vw=o.wipe&&s.type!=='card';if(vw)renderWipe(VR,VW-206,VH-292,190,142);g.clearRect(0,0,VW,VH);g.drawImage(VR.domElement,0,0,VW,VH);

    const L=[];if(o.bm)L.push([o.bm,headPos(MAN),o.angry,false]);if(o.bp)L.push([o.bp,headPos(o.bpAt||ME),false,!o.bpAt]);if(o.bg){const ga=o.bg[0]?G2:G1;if(ga.g.visible)L.push([o.bg[1],headPos(ga),false,false]);}vBubs(g,L,obs,VW,VH);}

   g.font='900 26px "Hiragino Maru Gothic ProN",system-ui,sans-serif';g.fillStyle='#ffd23a';txt(t(G.civ?'cntC':'cnt',{n:s.say||1}),VW/2,104);

  $('vShare').hidden=!canShare;$('vSave').hidden=false;$('vMsg').textContent=canShare?t('vmade'):t('shareHint');

function drawTelop(g,txt,W,H){g.save();g.translate(W/2,H-250);g.rotate(-3*Math.PI/180);let fs=58;const F=z=>'900 '+z+'px "Hiragino Maru Gothic ProN",system-ui,sans-serif';g.font=F(fs);while(g.measureText(txt).width>W-60&&fs>26){fs-=4;g.font=F(fs);}
